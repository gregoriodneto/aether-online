server {
    listen 80;
    server_name localhost;

    location = /health {
        proxy_pass http://game-server:8000;
    }

    location = /server/status {
        proxy_pass http://game-server:8000;
    }

    location = /players/connect {
        proxy_pass http://game-server:8000;
    }

    location / {
        return 404;
    }
}