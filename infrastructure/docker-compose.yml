services:
  postgres:
    image: postgres:17
    container_name: aether-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aether_characters
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: 
        - CMD-SHELL
        - pg_isready -U aether -d aether_characters
      interval: 5s
      timeout: 3s
      retries: 10

  game-server:
    image: aether-game-server:1.2
    container_name: aether-game-server
    build: 
      context: ../services/game-server
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    restart: unless-stopped
    networks: 
      - aether-network
    
networks:
  aether-network:

volumes:
  postgres_data: