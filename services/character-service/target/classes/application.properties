spring.application.name=character-service

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aether_characters}
spring.datasource.username=${DB_USER:aether}
spring.datasource.password=${DB_PASSWORD:aether_dev_password}

# Será controlado pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info